# 微信云托管部署配置文件
# 用于微信云托管控制台快速部署
# 放在项目根目录，与 Dockerfile 同级

# 服务配置
service:
  name: octopus-broker-api
  description: 章鱼经纪人后端API服务

# 容器配置
container:
  # Dockerfile 路径（相对于项目根目录）
  dockerfile: Dockerfile

  # 构建上下文（项目根目录）
  context: .

  # 容器端口
  port: 3000

  # 容器规格（最小配置）
  specs:
    cpu: 0.25
    memory: 512

  # 副本数量
  replicas:
    min: 1
    max: 5

# 环境变量配置
# ⚠️ 重要：以下敏感信息需要在微信云托管控制台手动配置
environment:
  # 必需环境变量
  - name: NODE_ENV
    value: production

  - name: PORT
    value: "3000"

  # 微信小程序配置
  - name: WX_APP_ID
    value: "wxd244b605ba704aab"

  - name: WX_APP_SECRET
    value: "ae5e9dfb01d85d39bbfe0788c303cd4c"

  # JWT 密钥
  - name: JWT_SECRET
    value: "zhangyu-broker-jwt-secret-2024-production"

  - name: JWT_EXPIRES_IN
    value: "30d"

  # Supabase 数据库配置
  - name: COZE_SUPABASE_URL
    value: "https://br-right-kea-1c046413.supabase2.aidap-global.cn-beijing.volces.com"

  - name: COZE_SUPABASE_ANON_KEY
    value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjMzNTUxOTc1MTEsInJvbGUiOiJhbm9uIn0.fhHIWFyG7cuJJhcbgJrnqhBgcUmVup-THZe_HhihcO8"

  - name: COZE_SUPABASE_SERVICE_ROLE_KEY
    value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjMzNTUxOTc1MTEsInJvbGUiOiJhbm9uIn0.fhHIWFyG7cuJJhcbgJrnqhBgcUmVup-THZe_HhihcO8"

  # 腾讯云 COS（可选）
  - name: COS_SECRET_ID
    value: "your-cos-secret-id"

  - name: COS_SECRET_KEY
    value: "xgpkRt89wVt40gHoJeAczLcgX9WhiU0G"

  - name: COS_BUCKET_NAME
    value: "7072-prod-9gchot580b331407-1416950024"

  - name: COS_REGION
    value: "ap-shanghai"

# 自动扩缩容配置
autoscaling:
  enabled: true
  cpuThreshold: 70
  memoryThreshold: 80
  minReplicas: 1
  maxReplicas: 5

# 健康检查配置
healthCheck:
  liveness:
    path: /api/health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /api/health
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# 日志配置
logging:
  enabled: true
  retentionDays: 7
